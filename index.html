<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI信件產生工具</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --border-focus: #4285f4;
      --bg: #f8f9fa;
      --text: #202124;
      --text-muted: #5f6368;
      --shadow-sm: 0 1px 3px rgba(60,64,67, 0.12), 0 1px 2px rgba(60,64,67, 0.08);
      --danger: #d93025;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f3f4;
      color: var(--text);
      line-height: 1.6;
      padding: 40px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #1e293b;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 頂部分頁切換按鈕 */
    .tab-navigation {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background-color: #e8f0fe;
      color: var(--primary);
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    /* 三欄排版配置 */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      .container { padding: 20px; }
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
      color: #374151;
    }

    select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.15);
    }

    textarea {
      height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    /* 拖曳上傳區 */
    .dropzone {
      border: 2px dashed #b0bec5;
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      background: #fbfcfe;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: #e8f0fe;
    }

    .dropzone-icon {
      font-size: 28px;
      color: #78909c;
      margin-bottom: 4px;
    }

    .dropzone p {
      font-size: 14px;
      color: #455a64;
      font-weight: 500;
    }

    .dropzone span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .file-chip {
      background: #edf2f7;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2d3748;
    }

    .file-chip .remove-btn {
      cursor: pointer;
      font-weight: bold;
      color: #a0aec0;
      border: none;
      background: transparent;
      font-size: 14px;
      line-height: 1;
    }

    .file-chip .remove-btn:hover {
      color: var(--danger);
    }

    .disclaimer {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .disclaimer-icon {
      font-size: 13px;
      color: #f59e0b;
      line-height: 1.3;
    }

    .action-row {
      margin: 20px 0;
      display: flex;
      align-items: center;
    }

    button.primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s, transform 0.1s;
    }

    button.primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.primary-btn:disabled {
      background: #bdc1c6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .output-section {
      margin-top: 10px;
    }

    .output-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 20px;
      min-height: 160px;
      white-space: pre-wrap;
      font-size: 14px;
      position: relative;
      color: var(--text);
      line-height: 1.6;
    }

    .output-card.active {
      background: #ffffff;
      border-color: #c2e7ff;
      box-shadow: inset 0 0 0 1px #c2e7ff;
    }

    .copy-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: #f1f3f4;
      border-color: #bdc1c6;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      background: #f1f3f4;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>AI信件產生工具</h2>
      <p id="headerSubtitle">專為工程現場所需的信件中翻英、專門名詞對照與商務文件分析設計</p>
    </div>

    <!-- 模式切換按鈕：中翻英 / 文件分析 -->
    <div class="tab-navigation">
      <button class="tab-btn active" id="tabTranslate" onclick="switchMode('translate')">中翻英</button>
      <button class="tab-btn" id="tabDocAnalysis" onclick="switchMode('analysis')">文件分析</button>
    </div>

    <!-- 全域控制設定（專業領域、語氣設定、發信心情） -->
    <div class="controls">
      <div>
        <label for="categorySelect">專業領域類別：</label>
        <select id="categorySelect">
          <option value="General">日常/採購商務 (General)</option>
          <option value="Electrical">電機工程 (Electrical)</option>
          <option value="Instrumentation">儀表控制 (Instrument)</option>
